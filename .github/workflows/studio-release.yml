# Creative Studio release for sharek: a tag push (v0.0.2-test, v0.1.0, ...) builds the unsigned
# packages for macOS, Windows and Linux through rsm's reusable build-release.yml. A tag with a '-'
# is a pre-release. Kept apart from upstream's release.yml so merges stay clean.
name: Studio release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release sharek
    permissions:
      contents: write
    uses: 7mz410/CreativeStudio-rsm/.github/workflows/build-release.yml@main
    with:
      app: sharek
      package: figcraft
      version_var: FIGCRAFT_VERSION
      bundle: FigCraft.app
      fonts_ref: 43913056ce82a3fdad0ef69f6b88d1dc922a8104
      tag: ${{ github.ref_name }}
